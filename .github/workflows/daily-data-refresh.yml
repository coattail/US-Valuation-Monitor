name: Daily Data Refresh

on:
  schedule:
    # Start 7 minutes after the regular US close, then retry at +22/+47.
    # Both UTC offsets are covered; the plan skips pre-close winter runs.
    - cron: "7,22,47 20,21 * * 1-5"
    # Company valuations follow Yahoo's daily source, independently of the
    # index-only close estimates. 06:17 / 09:17 Asia/Shanghai.
    - cron: "17 22 * * 1-5"
    - cron: "17 1 * * 2-6"
    # Full source/history synchronization and independent overnight recovery.
    # 13:17 / 17:17 Asia/Shanghai.
    - cron: "17 5 * * 2-6"
    - cron: "17 9 * * 2-6"
  workflow_dispatch:
    inputs:
      mode:
        description: "close: index estimates only; company: Yahoo source sync; full: all sources"
        type: choice
        options: [full, close, company]
        default: full

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

concurrency:
  group: daily-data-refresh
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      target: ${{ steps.plan.outputs.target }}
      run: ${{ steps.plan.outputs.run }}
      datasets: ${{ steps.plan.outputs.datasets }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - id: plan
        name: Select completed session and refresh mode
        env:
          REFRESH_EVENT: ${{ github.event_name }}
          REFRESH_SCHEDULE: ${{ github.event.schedule }}
          REFRESH_MODE: ${{ inputs.mode || 'full' }}
        run: node scripts/market-close-plan.mjs

  build:
    name: Refresh ${{ matrix.dataset }}
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dataset: ${{ fromJSON(needs.plan.outputs.datasets) }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Dispatching a repair branch validates that branch's actual code.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - name: Build and repair dataset
        if: needs.plan.outputs.mode == 'full' || matrix.dataset == 'company'
        timeout-minutes: 20
        run: npm run build:data:${{ matrix.dataset }}
      - name: Derive index valuations from completed-session closes
        if: needs.plan.outputs.mode == 'close'
        timeout-minutes: 8
        run: npm run refresh:close:index
      - name: Reconcile dated WSJ observations even when trading dates are complete
        id: wsj
        continue-on-error: true
        if: matrix.dataset == 'index'
        timeout-minutes: 3
        run: npm run refresh:wsj:index
      - name: Validate company history
        if: matrix.dataset == 'company'
        run: npm run validate:data:company
      - name: Stage validated files
        run: node scripts/stage-refresh-artifact.mjs ${{ matrix.dataset }}
      # Upload before freshness checks: valid progress must be published even
      # when one symbol remains unavailable. Missing dates still fail the run.
      - uses: actions/upload-artifact@v4
        with:
          name: dataset-${{ matrix.dataset }}
          path: refresh-artifact/
          retention-days: 7
          if-no-files-found: error
      - name: Require fresh WSJ observations and matching published values
        if: matrix.dataset == 'index'
        env:
          WSJ_SYNC_OUTCOME: ${{ steps.wsj.outcome }}
        run: |
          if [ "$WSJ_SYNC_OUTCOME" != "success" ]; then
            echo '::error::WSJ synchronization failed. Existing valid progress is retained; the next scheduled run retries.'
            exit 1
          fi
          node scripts/sync-wsj-valuations.mjs --check
      - name: Require all completed sessions
        run: node scripts/validate-data-freshness.mjs ${{ matrix.dataset }}

  publish:
    name: Publish available datasets
    needs: [plan, build]
    # Branch dispatches exercise the real sources without publishing to main.
    if: ${{ always() && !cancelled() && needs.plan.outputs.run == 'true' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          # A normal push triggers both production deployment workflows.
          token: ${{ secrets.REPO_PUSH_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: dataset-*
          path: refresh-artifact
          merge-multiple: true
      - name: Commit and push available progress
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-refresh-artifacts.mjs
          git add -A data/standardized
          if git diff --cached --quiet; then
            echo "No dataset changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): refresh available datasets"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.event.repository.default_branch }}"; then
              exit 0
            fi
            git fetch origin "${{ github.event.repository.default_branch }}"
            git rebase "origin/${{ github.event.repository.default_branch }}"
          done
          exit 1
      - name: Explain incomplete recovery
        if: always() && needs.build.result != 'success'
        run: |
          echo '::error::At least one dataset failed to build or has missing trading dates. Available validated data was published; inspect the failed build job. The next scheduled run retries recovery.'
          echo '## Incomplete refresh' >> "$GITHUB_STEP_SUMMARY"
          echo 'Available validated datasets are published independently. Check the build logs for missing symbols/dates. The later recovery schedule will retry.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
