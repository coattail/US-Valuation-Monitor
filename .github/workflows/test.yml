name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - name: Verify live split-event response on manual runs
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { fetchYahooSplitEvents } from './packages/data-pipeline/src/split-events.ts';
          const events = await fetchYahooSplitEvents('SOXX','2026-11-04','2026-11-05');
          assert.ok(events.some(event => event.date === '2026-11-05' && event.ratio === 3));
          console.log('Verified dated, symbol-matched SOXX split metadata:', events);
          JS
      - run: npm test
      - run: npm run build:site
